steal:
  require-player-kill: true
  announce-to-server: true
  restore-health-on-steal: true
  message-prefix: "&6[StatSteal]&r "
  excluded-player-names:
    - "Bot"
  excluded-player-name-prefixes:
    - "Bot"

notifications:
  title:
    fade-in-millis: 300
    stay-seconds: 8
    fade-out-millis: 700

rules:
  show-on-join: true
  join-delay-ticks: 40
  lines:
    - "No End Crystals or Respawn Anchors."
    - "No command blocks."
    - "No X-ray mods or resource packs."
    - "No cheats."
    - "Strength II and Speed II effects may last no longer than 20 seconds."
    - "No auto-clickers."

restrictions:
  disable-end-crystals: true
  disable-respawn-anchors: true

stats:
  max-health:
    enabled: true
    steal-amount: 2.0
    min-value: 10.0
    max-value: 30.0
    display-name: "Max Health"
  attack-damage:
    enabled: true
    steal-amount: 1.0
    min-value: 0.0
    max-value: 6.0
    display-name: "Attack Damage"
  movement-speed:
    enabled: true
    steal-amount: 0.005
    min-value: 0.05
    max-value: 0.15
    display-name: "Movement Speed"
  attack-speed:
    enabled: false
    steal-amount: 0.1
    min-value: 2.0
    max-value: 8.0
    display-name: "Attack Speed"
  armor:
    enabled: true
    steal-amount: 1.0
    min-value: -5.0
    max-value: 5.0
    display-name: "Armor"
  luck:
    enabled: false
    steal-amount: 1.0
    min-value: -5.0
    max-value: 10.0
    display-name: "Luck"
