name: StatStealSmp
version: 0.7.1
main: com.local.minecraft.statsteal.StatStealPlugin
api-version: '1.21'
commands:
  statsteal:
    description: View or manage StatSteal SMP data.
    usage: /statsteal <stats|reload|resetplayer|resetall>
  rules:
    description: View the server rules.
    usage: /rules
permissions:
  statsteal.admin:
    default: op
