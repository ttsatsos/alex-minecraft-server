name: LocalAiNpc
version: 0.2.0
main: com.local.minecraft.ainpc.LocalAiNpcPlugin
api-version: '1.21'
depend:
  - Citizens
  - Sentinel
commands:
  ainpc:
    description: Manage AI-backed Citizens NPC companions.
    usage: /ainpc help
    permission: localainpc.admin
  bots:
    description: Create and direct autonomous computer players.
    usage: /bots help
    permission: localainpc.admin
permissions:
  localainpc.admin:
    default: op
