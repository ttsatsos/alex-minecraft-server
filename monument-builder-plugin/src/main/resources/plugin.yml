name: MonumentBuilder
version: 0.2.0
main: com.local.minecraft.monuments.MonumentBuilderPlugin
api-version: '1.21'
commands:
  monument:
    description: Build and manage generated monuments.
    usage: /monument <build|visit|undo|status>
  castle:
    description: Visit the Fantasy Magic Castle district.
    usage: /castle
permissions:
  monument.admin:
    default: op
  monument.visit:
    default: true
  monument.castle:
    default: true
